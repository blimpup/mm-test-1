# A plan and an apply join the run of the steps before them.  The default,
# setup, permits the tree builder, the config builder and the indexer only.
batch_runs:
  merge_steps: all

dirs:
  database1:
    when_modified:
      depends_on: dir:base
  database2:
    when_modified:
      depends_on: dir:base
  webservice:
    when_modified:
      depends_on: dir:database1 or dir:database2
engine:
  name: tofu
