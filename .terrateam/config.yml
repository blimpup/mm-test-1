# The commit pushed during the apply.  Its config builder waits longer than the apply runs, thus the
# server has no built config of this commit when the result of the apply arrives (RFD 2356, Fail
# safe).
config_builder:
  enabled: true
  script: |
    #! /usr/bin/env bash
    sleep 90
    echo '{"engine": {"name": "tofu"}}'

engine:
  name: tofu

hooks:
  apply:
    pre:
    - cmd:
      - 'sleep'
      - '60'
      type: run
