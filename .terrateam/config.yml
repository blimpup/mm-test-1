# The commit pushed during the apply.  Its tree builder waits longer than the apply runs, thus the
# server has no tree of this commit when the result of the apply arrives (RFD 2356, Fail safe).
tree_builder:
  enabled: true
  script: |
    #! /usr/bin/env bash
    sleep 90
    $TERRATEAM_ROOT/bin/tree-builder

engine:
  name: tofu

hooks:
  apply:
    pre:
    - cmd:
      - 'sleep'
      - '60'
      type: run
