# RFD 2903: a cap of two binds, so six plan work manifests take three runs.
#
# compute_node_work/0002 measured two runs after the plan: one for the three
# setup steps and one for the five plans, both at the default cap of nine.
# This is that fixture with a cap of two and six workspaces.  The cap of two
# splits the three setup work manifests over two nodes, so the setup takes two
# runs.  The same cap splits the six plan work manifests over three nodes, so the
# plans take three runs.  The count after the plan is therefore five.
#
# The six applies take three runs for the same reason, so the count after the
# apply is eight: the five above and three more.
batch_runs:
  enabled: true
  max_workspaces_per_batch: 1
  max_work_manifests_per_node: 2
  merge_steps: by_phase

# The limit counts work manifests and not nodes, so it has to stay above the six
# plans for the count of runs to be one number.  A lower limit holds plans back,
# and a plan that the node of its own turn may not serve is moved to a node of
# its own, which is a run of its own.  The count of runs then depends on which of
# the node poll and the dispatcher takes a freed slot.  Six is above the six
# plans, so the cap alone decides the count.
work_manifests:
  concurrent_runs: 6

# The three steps that prepare a job.  The tree builder gives the tree of the
# repository, and the config builder turns the indexer on.
tree_builder:
  enabled: true
  script: '${TERRATEAM_ROOT}/bin/tree-builder'

config_builder:
  enabled: true
  script: |
    #! /usr/bin/env python3
    import json
    import sys
    config = json.loads(sys.stdin.read())
    config.setdefault('indexer', {})['enabled'] = True
    print(json.dumps(config))

# Six workspaces of one directory.  The directory changed, so every workspace
# plans, and batch_runs makes each one a work manifest of its own.
dirs:
  terraform:
    workspaces:
      one: {}
      two: {}
      three: {}
      four: {}
      five: {}
      six: {}

# Every workspace takes the tfvars file that carries its own name, so the six
# workspaces of one directory plan six values of the variable that main.tf
# reads.  ${TERRATEAM_WORKSPACE} is the workspace of the run, and the file sits
# next to main.tf, which is where the steps run.  The apply takes no file of its
# own: it applies the plan that the plan step stored, and the plan carries the
# values.
workflows:
  - tag_query: ''
    plan:
      - type: init
      - type: plan
        extra_args: ['-var-file=${TERRATEAM_WORKSPACE}.tfvars']

engine:
  name: tofu