# A plan and an apply join the run of the steps before them.  The default,
# setup, permits the tree builder, the config builder and the indexer only.
batch_runs:
  merge_steps: all

cost_estimation:
  enabled: false

tree_builder:
  enabled: true
  script: '${TERRATEAM_ROOT}/bin/generate build-tree'

config_builder:
  enabled: true
  script: '${TERRATEAM_ROOT}/bin/generate build-config'

hooks:
  all:
    pre:
      - type: run
        cmd: ['${TERRATEAM_ROOT}/bin/generate', 'build']
