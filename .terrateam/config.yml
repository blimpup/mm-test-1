# A layered run: database depends on base.  The apply of base is held open by a hook, so
# that the test can change base while it runs (RFD 2356).

dirs:
  database:
    when_modified:
      depends_on: dir:base
engine:
  name: tofu

hooks:
  apply:
    pre:
    - cmd:
      - 'sleep'
      - '60'
      type: run
