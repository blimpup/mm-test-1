engine:
  name: tofu
# The test proves that the comment starts the run it asks for, so the comment has to be the only
# plan of the pull request.  An autoplan of the same context plans the dirspace first, and the
# comment is then answered as already planned and starts nothing.
when_modified:
  autoplan: false
parameters:
  names:
    mode:
      values:
      - DEBUG
      - RELEASE
    region:
      values:
      - us-east-1
workflows:
- plan:
  - capture_output: true
    cmd:
    - ${TERRATEAM_ROOT}/expect-param-env
    - mode
    type: run
  - capture_output: true
    cmd:
    - ${TERRATEAM_ROOT}/expect-param-env
    - region
    run_on: always
    type: run
  - type: init
  - type: plan
  tag_query: ''
