# RFD 2903: a cap of one gives every work manifest a compute node of its own.
#
# This is 0002 with one key more: max_work_manifests_per_node of one.  A new
# compute node starts with one work manifest used and the test is strict, so no
# work manifest can ever join a node -- not the three setup steps, not the five
# plans and not the five applies.  The count of action runs after the plan is
# eight: three setup and five plans.  The five applies take five runs of their
# own, so the count after the apply is thirteen.
batch_runs:
  enabled: true
  max_workspaces_per_batch: 1
  max_work_manifests_per_node: 1
  merge_steps: by_phase

# The three steps that prepare a job.  The tree builder gives the tree of the
# repository, and the config builder turns the indexer on.
tree_builder:
  enabled: true
  script: '${TERRATEAM_ROOT}/bin/tree-builder'

config_builder:
  enabled: true
  script: |
    #! /usr/bin/env python3
    import json
    import sys
    config = json.loads(sys.stdin.read())
    config.setdefault('indexer', {})['enabled'] = True
    print(json.dumps(config))

# Five workspaces of one directory.  The directory changed, so every workspace
# plans, and batch_runs makes each one a work manifest of its own.
dirs:
  terraform:
    workspaces:
      one: {}
      two: {}
      three: {}
      four: {}
      five: {}

# Every workspace takes the tfvars file that carries its own name, so the five
# workspaces of one directory plan five values of the variable that main.tf
# reads.  ${TERRATEAM_WORKSPACE} is the workspace of the run, and the file sits
# next to main.tf, which is where the steps run.  The apply takes no file of its
# own: it applies the plan that the plan step stored, and the plan carries the
# values.
workflows:
  - tag_query: ''
    plan:
      - type: init
      - type: plan
        extra_args: ['-var-file=${TERRATEAM_WORKSPACE}.tfvars']

engine:
  name: tofu