dirs:
  database:
    when_modified:
      depends_on: dir:base
engine:
  name: tofu
# The test proves that a comment starts the run it asks for, so the comment has to be the only
# plan of the pull request.  An autoplan of the same context plans the first layer first, and the
# comment is then answered as already planned and starts nothing.  A dir that sets a
# when_modified of its own keeps this value, because the dir inherits the keys it does not set.
when_modified:
  autoplan: false
parameters:
  names:
    mode:
      values:
      - DEBUG
      - RELEASE
      fail_if_set: true
